name: Deploy site

# Deploys on every push to `main`. Rename this to whatever your
# release branch is called if you'd rather gate releases through
# a different branch (e.g. `release`) and merge into it via PR.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a manual redeploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # whole repo root is the site; change if you add a build step

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
